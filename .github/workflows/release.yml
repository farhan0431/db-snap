name: Release

# Build six binaries, publish one npm package, and create a GitHub Release.
# Required secret: NPM_TOKEN with publish access to @farhan0431/db-snap.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  build-platform:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            cross: true
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install musl compiler
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@cross
      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
      - name: Strip binary (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: strip "target/${{ matrix.target }}/release/dbsnap" || true
      - name: Smoke test native binary
        if: matrix.cross != true
        shell: bash
        run: |
          EXT=""
          [ "${{ runner.os }}" = "Windows" ] && EXT=".exe"
          "target/${{ matrix.target }}/release/dbsnap$EXT" --version
      - name: Stage binary and release archive
        shell: bash
        run: |
          EXT=""
          [ "${{ runner.os }}" = "Windows" ] && EXT=".exe"
          mkdir -p "binaries/${{ matrix.target }}"
          cp "target/${{ matrix.target }}/release/dbsnap$EXT" "binaries/${{ matrix.target }}/dbsnap$EXT"
          if [ "${{ runner.os }}" = "Windows" ]; then
            powershell -Command "Compress-Archive -Path 'target/${{ matrix.target }}/release/dbsnap.exe' -DestinationPath 'dbsnap-${{ matrix.target }}.zip' -Force"
          else
            zip -j "dbsnap-${{ matrix.target }}.zip" "target/${{ matrix.target }}/release/dbsnap"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: binaries/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: zip-${{ matrix.target }}
          path: dbsnap-*.zip
          if-no-files-found: error

  release-meta:
    needs: build-platform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: https://registry.npmjs.org/
      - uses: actions/download-artifact@v4
        with:
          pattern: zip-*
          merge-multiple: true
          path: zips/
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          merge-multiple: true
          path: npm/binaries/
      - name: Test packed npm package
        shell: bash
        run: |
          for target in x86_64-unknown-linux-gnu x86_64-unknown-linux-musl aarch64-unknown-linux-gnu aarch64-apple-darwin x86_64-apple-darwin; do
            test -s "npm/binaries/$target/dbsnap"
            chmod +x "npm/binaries/$target/dbsnap"
          done
          test -s npm/binaries/x86_64-pc-windows-msvc/dbsnap.exe
          mkdir -p "$RUNNER_TEMP/dbsnap-package"
          npm pack ./npm --pack-destination "$RUNNER_TEMP/dbsnap-package"
          npm install --prefix "$RUNNER_TEMP/dbsnap-package/install" "$RUNNER_TEMP"/dbsnap-package/*.tgz
          "$RUNNER_TEMP/dbsnap-package/install/node_modules/.bin/dbsnap" --version
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: zips/*.zip
          generate_release_notes: true
      - name: Verify and publish npm package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node -e 'const p=require("./npm/package.json"); if(p.version!==process.argv[1]) throw Error("Package version must match release tag")' "$VERSION"
          for target in x86_64-unknown-linux-gnu x86_64-unknown-linux-musl aarch64-unknown-linux-gnu aarch64-apple-darwin x86_64-apple-darwin; do
            test -s "npm/binaries/$target/dbsnap"
            chmod +x "npm/binaries/$target/dbsnap"
          done
          test -s npm/binaries/x86_64-pc-windows-msvc/dbsnap.exe
          cd npm
          npm publish --access public
