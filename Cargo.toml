[package]
name = "dbsnap"
version = "0.3.11"
edition = "2021"
rust-version = "1.80"
description = "Instant physical database time-machine and MCP server for AI coding agents"
license = "MIT"
repository = "https://github.com/farhan0431/db-snap"
keywords = ["database", "sqlite", "postgres", "mysql", "mcp", "snapshot", "ai"]
categories = ["command-line-utilities", "database", "development-tools"]

[dependencies]
anyhow = "1.0"
blake3 = "1.5"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
colored = "2.1"
dotenvy = "0.15"
fs4 = "0.8"
postgres = "0.19"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"
zstd = "0.13"

[lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = 3
